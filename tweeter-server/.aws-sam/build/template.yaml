  visitTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: visit
      AttributeDefinitions:
      - AttributeName: person_name
        AttributeType: S
      - AttributeName: place_name
        AttributeType: S
      KeySchema:
      - AttributeName: person_name
        KeyType: HASH
      - AttributeName: place_name
        KeyType: RANGE
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
      GlobalSecondaryIndexes:
      - IndexName: place_index
        KeySchema:
        - AttributeName: place_name
          KeyType: HASH
        - AttributeName: person_name
          KeyType: RANGE
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1
        Projection:
          ProjectionType: ALL
  followTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: follow
      AttributeDefinitions:
      - AttributeName: follower_alias
        AttributeType: S
      - AttributeName: followee_alias
        AttributeType: S
      KeySchema:
      - AttributeName: follower_alias
        KeyType: HASH
      - AttributeName: followee_alias
        KeyType: RANGE
      BillingMode: PROVISIONED
