AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SAM config for Tweeter server

#
# Global Lambda function properties. These apply to every Lambda function.
#
Globals:
  Function:
    Runtime: nodejs20.x
    CodeUri: ./dist/
    Layers:
      - !Ref tweeterLayer
    Timeout: 30
    MemorySize: 128

#
# Reusable blocks of configuration. These are referenced throughout the template to avoid duplication.
# &identifier is used to define a reusable block, and *identifier is used to reference it.
#
Metadata:
  x-common-policies: &commonPolicies
    - AWSLambdaBasicExecutionRole
    - AmazonSESFullAccess
    - CloudWatchFullAccess
    - AmazonDynamoDBFullAccess
    - AmazonS3FullAccess
    - AmazonSQSFullAccess

  x-common-cors-headers: &commonCorsHeaders
    method.response.header.Access-Control-Allow-Origin: "'*'"

  x-common-swagger-response-headers: &commonSwaggerResponseHeaders
    Access-Control-Allow-Origin:
      type: string

#
# AWS resource definitions
#
Resources:
  #
  # Web API
  #

  tweeterApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: tweeterApi
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE'"
        AllowHeaders: "'*'"
        AllowOrigin: "'*'"
      DefinitionBody:
        swagger: "2.0"
        info:
          title: "Tweeter API"
          version: "1.0"
        x-common-consumes: &commonConsumes
          - application/json
        x-common-produces: &commonProduces
          - application/json
        x-common-request-templates: &commonRequestTemplates
          application/json: $input.json('$')
        x-common-amazon-responses: &commonAmazonResponses
          default:
            statusCode: 200
            responseParameters: *commonCorsHeaders
          ".*bad-request.*":
            statusCode: 400
            responseParameters: *commonCorsHeaders
            responseTemplates:
              application/json: '{ "error": "$input.path(''$.errorMessage'')" }'
          ".*unauthorized.*":
            statusCode: 401
            responseParameters: *commonCorsHeaders
            responseTemplates:
              application/json: '{ "error": "$input.path(''$.errorMessage'')" }'
          ".*internal-server-error.*":
            statusCode: 500
            responseParameters: *commonCorsHeaders
            responseTemplates:
              application/json: '{ "error": "$input.path(''$.errorMessage'')" }'
        x-common-swagger-responses: &commonSwaggerResponses
          "200":
            description: "OK"
            headers: *commonSwaggerResponseHeaders
          "400":
            description: "Bad Request"
            headers: *commonSwaggerResponseHeaders
          "401":
            description: "Unauthorized"
            headers: *commonSwaggerResponseHeaders
          "500":
            description: "Internal Server Error"
            headers: *commonSwaggerResponseHeaders
        paths:
          #
          # Endpoint definitions
          #

          ##### >>> NEW: /followees endpoint (getFolloweesLambda) >>>
          # POST /followees -> getFolloweesLambda
          # Returns one page of the users that the given user follows (their followees).
          # Request: { token, userAlias, pageSize, lastItem (UserDto | null) }
          # Response: { success, message, items (UserDto[]), hasMore }
          /followees:
            post:
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${getFolloweesLambda.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses
          ##### <<< END NEW: /followees endpoint <<<

          ##### >>> NEW: /followers endpoint (getFollowersLambda) >>>
          # POST /followers -> getFollowersLambda
          # Returns one page of the users who follow the given user (their followers).
          # Request: { token, userAlias, pageSize, lastItem (UserDto | null) }
          # Response: { success, message, items (UserDto[]), hasMore }
          /followers:
            post:
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${getFollowersLambda.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses
          ##### <<< END NEW: /followers endpoint <<<

          ##### >>> NEW: /feed endpoint (getFeedItemsLambda) >>>
          # POST /feed -> getFeedItemsLambda
          # Returns one page of the given user's feed (statuses posted by the users they follow).
          # Request: { token, userAlias, pageSize, lastItem (StatusDto | null) }
          # Response: { success, message, items (StatusDto[]), hasMore }
          /feed:
            post:
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${getFeedItemsLambda.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses
          ##### <<< END NEW: /feed endpoint <<<

          ##### >>> NEW: /story endpoint (getStoryItemsLambda) >>>
          # POST /story -> getStoryItemsLambda
          # Returns one page of the given user's story (statuses the user has posted).
          # Request: { token, userAlias, pageSize, lastItem (StatusDto | null) }
          # Response: { success, message, items (StatusDto[]), hasMore }
          /story:
            post:
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${getStoryItemsLambda.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses
          ##### <<< END NEW: /story endpoint <<<

          ##### >>> NEW: /login endpoint (loginLambda) >>>
          # POST /login -> loginLambda
          # Signs a user in with their alias and password and starts a new session.
          # Request: { alias, password }
          # Response: { success, message, user (UserDto), token }
          /login:
            post:
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${loginLambda.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses
          ##### <<< END NEW: /login endpoint <<<

          ##### >>> NEW: /register endpoint (registerLambda) >>>
          # POST /register -> registerLambda
          # Creates a new user account (with a profile image) and signs the new user in.
          # Request: { firstName, lastName, alias, password, userImageBytes (base64 string), imageFileExtension }
          # Response: { success, message, user (UserDto), token }
          /register:
            post:
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${registerLambda.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses
          ##### <<< END NEW: /register endpoint <<<

          ##### >>> NEW: /getuser endpoint (getUserLambda) >>>
          # POST /getuser -> getUserLambda
          # Looks up a user by their alias.
          # Request: { token, alias }
          # Response: { success, message, user (UserDto | null) }
          /getuser:
            post:
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${getUserLambda.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses
          ##### <<< END NEW: /getuser endpoint <<<

          ##### >>> NEW: /logout endpoint (logoutLambda) >>>
          # POST /logout -> logoutLambda
          # Signs the current user out by ending the session tied to their auth token.
          # Request: { token }
          # Response: { success, message }
          /logout:
            post:
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${logoutLambda.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses
          ##### <<< END NEW: /logout endpoint <<<

          ##### >>> NEW: /isfollower endpoint (getIsFollowerLambda) >>>
          # POST /isfollower -> getIsFollowerLambda
          # Checks whether one user (userAlias) follows another user (selectedUserAlias).
          # Request: { token, userAlias, selectedUserAlias }
          # Response: { success, message, isFollower }
          /isfollower:
            post:
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${getIsFollowerLambda.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses
          ##### <<< END NEW: /isfollower endpoint <<<

          ##### >>> NEW: /followeecount endpoint (getFolloweeCountLambda) >>>
          # POST /followeecount -> getFolloweeCountLambda
          # Returns how many users the given user follows.
          # Request: { token, userAlias }
          # Response: { success, message, count }
          /followeecount:
            post:
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${getFolloweeCountLambda.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses
          ##### <<< END NEW: /followeecount endpoint <<<

          ##### >>> NEW: /followercount endpoint (getFollowerCountLambda) >>>
          # POST /followercount -> getFollowerCountLambda
          # Returns how many users follow the given user.
          # Request: { token, userAlias }
          # Response: { success, message, count }
          /followercount:
            post:
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${getFollowerCountLambda.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses
          ##### <<< END NEW: /followercount endpoint <<<

          ##### >>> NEW: /follow endpoint (followLambda) >>>
          # POST /follow -> followLambda
          # Makes the current user follow the given user, then returns that user's updated counts.
          # Request: { token, userAlias (the user to follow) }
          # Response: { success, message, followerCount, followeeCount }
          /follow:
            post:
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${followLambda.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses
          ##### <<< END NEW: /follow endpoint <<<

          ##### >>> NEW: /unfollow endpoint (unfollowLambda) >>>
          # POST /unfollow -> unfollowLambda
          # Makes the current user stop following the given user, then returns that user's updated counts.
          # Request: { token, userAlias (the user to unfollow) }
          # Response: { success, message, followerCount, followeeCount }
          /unfollow:
            post:
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${unfollowLambda.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses
          ##### <<< END NEW: /unfollow endpoint <<<

          ##### >>> NEW: /poststatus endpoint (postStatusLambda) >>>
          # POST /poststatus -> postStatusLambda
          # Posts a new status for the current user, adding it to their story and their followers' feeds.
          # Request: { token, newStatus (StatusDto) }
          # Response: { success, message }
          /poststatus:
            post:
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${postStatusLambda.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses
          ##### <<< END NEW: /poststatus endpoint <<<

          #
          # TODO: ADD MORE ENDPOINT DEFINITIONS HERE
          #

  #
  # SQS Queues  (This will become relevant in Milestone 4. For M3, leave this section commented out.)
  #

  #   MyQueue:
  #     Type: AWS::SQS::Queue
  #     Properties:
  #       QueueName: MyQueue

  #
  # Lambda Layer (reused by all Lambda functions)
  #
  tweeterLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: tweeterLayer
      Description: dependencies layer for Tweeter server
      ContentUri: ./layer/
      CompatibleRuntimes:
        - nodejs20.x
      RetentionPolicy: DELETE

  #
  # Web API Lambda functions
  #

  ##### TODO: Change "userGetFunction" to the actual function name.
  ##### It must match the function name in the "Endpoint definitons" section above.

  ##### >>> NEW: getFolloweesLambda function >>>
  getFolloweesLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: getFolloweesLambda
      Handler: lambda/follow/GetFolloweesLambda.handler
      Policies: *commonPolicies
      Events:
        PostApi:
          Type: Api
          Properties:
            RestApiId: !Ref tweeterApi
            Path: /followees
            Method: POST
  ##### <<< END NEW: getFolloweesLambda function <<<

  ##### >>> NEW: getFollowersLambda function >>>
  getFollowersLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: getFollowersLambda
      Handler: lambda/follow/GetFollowersLambda.handler
      Policies: *commonPolicies
      Events:
        PostApi:
          Type: Api
          Properties:
            RestApiId: !Ref tweeterApi
            Path: /followers
            Method: POST
  ##### <<< END NEW: getFollowersLambda function <<<

  ##### >>> NEW: getFeedItemsLambda function >>>
  getFeedItemsLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: getFeedItemsLambda
      Handler: lambda/status/GetFeedItemsLambda.handler
      Policies: *commonPolicies
      Events:
        PostApi:
          Type: Api
          Properties:
            RestApiId: !Ref tweeterApi
            Path: /feed
            Method: POST
  ##### <<< END NEW: getFeedItemsLambda function <<<

  ##### >>> NEW: getStoryItemsLambda function >>>
  getStoryItemsLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: getStoryItemsLambda
      Handler: lambda/status/GetStoryItemsLambda.handler
      Policies: *commonPolicies
      Events:
        PostApi:
          Type: Api
          Properties:
            RestApiId: !Ref tweeterApi
            Path: /story
            Method: POST
  ##### <<< END NEW: getStoryItemsLambda function <<<

  ##### >>> NEW: loginLambda function >>>
  loginLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: loginLambda
      Handler: lambda/user/LoginLambda.handler
      Policies: *commonPolicies
      Events:
        PostApi:
          Type: Api
          Properties:
            RestApiId: !Ref tweeterApi
            Path: /login
            Method: POST
  ##### <<< END NEW: loginLambda function <<<

  ##### >>> NEW: registerLambda function >>>
  registerLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: registerLambda
      Handler: lambda/user/RegisterLambda.handler
      Policies: *commonPolicies
      Events:
        PostApi:
          Type: Api
          Properties:
            RestApiId: !Ref tweeterApi
