  ##### <<< END NEW: registerLambda function <<<

  ##### >>> NEW: getUserLambda function >>>
  getUserLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: getUserLambda
      Handler: lambda/user/GetUserLambda.handler
      Policies: *commonPolicies
      Events:
        PostApi:
          Type: Api
          Properties:
            RestApiId: !Ref tweeterApi
            Path: /getuser
            Method: POST
  ##### <<< END NEW: getUserLambda function <<<

  ##### >>> NEW: logoutLambda function >>>
  logoutLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: logoutLambda
      Handler: lambda/user/LogoutLambda.handler
      Policies: *commonPolicies
      Events:
        PostApi:
          Type: Api
          Properties:
            RestApiId: !Ref tweeterApi
            Path: /logout
            Method: POST
  ##### <<< END NEW: logoutLambda function <<<

  ##### >>> NEW: getIsFollowerLambda function >>>
  getIsFollowerLambda:
    Type: AWS::Serverless::Function
    Properties:
